apiVersion: v1
kind: Pod
metadata:
  name: empty-dir-demo
  namespace: default
spec:
  containers:
  - name: nginx
    image: nginx
    # mounting the volume to nginx
    volumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-logs

  - name: almalinux
    image: almalinux:9
    # mounting the volume to almalinux 
    volumeMounts:
    - mountPath: /mnt/nginx-log
      name: nginx-logs
      readOnly: true # if we mention readOnly true then almalinux can read the logs but it cannot change the logs generated by nginx


  # creating volumes
  volumes:
  - name: nginx-logs
    emptyDir:
      sizeLimit: 100Mi